methods:
  - id: m-llm
    label: LLM & NLP methods
    description: LLM and NLP methods connect all four questions, from human social learning to adaptive policy communication.
  - id: m-interactive
    label: Interactive AI systems
    description: Interactive AI systems connect privacy comprehension and human agency to the ICLR 2025 privacy-agent study.
  - id: m-experiments
    label: Behavioral experiments
    description: Behavioral experiments connect social learning and privacy comprehension to two human-centered AI studies.
  - id: m-css
    label: Computational social science
    description: Computational social science links information selection and adaptive policy communication across social and institutional settings.
  - id: m-corpus
    label: Corpus & annotation pipelines
    description: Corpus and annotation pipelines connect adaptive policy communication to CAPC-CG at ACL 2026.

phenomena:
  - id: q-social
    label: Social learning & selection
    description: Behavioral experiments + computational social science → social learning and information selection → Artificial Intelligence Systems Distort Upstream Selection in Human Social Learning (PsyArXiv, 2026).
  - id: q-privacy
    label: Privacy comprehension & agency
    description: Interactive AI systems + behavioral experiments → privacy comprehension and human agency → Empowering Users in Digital Privacy Management through Interactive LLM-Based Agents (ICLR 2025).
  - id: q-sufficiency
    label: Information sufficiency
    description: LLM and NLP evaluation → information sufficiency and adaptive stopping → Language Models (Mostly) Know When to Stop Reading (NeurIPS 2025).
  - id: q-policy
    label: Adaptive policy communication
    description: LLM/NLP + computational social science + corpus annotation → adaptive policy communication → CAPC-CG (ACL 2026 Main, Oral).

papers:
  - id: p-social
