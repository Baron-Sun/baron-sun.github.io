  - id: p-capc
    key: capc
    short: CAPC-CG Policy Communication Corpus
    title: "CAPC-CG: A Large-Scale, Expert-Directed LLM-Annotated Corpus of Adaptive Policy Communication in China"
    venue: ACL 2026 Main · Oral
    authors: Bolun Sun · Charles Chang · Yuen Yuen Ang · Ruotong Mu · Yuchen Xu · Zhengxin Zhang · Pingxu Hao
    url: https://aclanthology.org/2026.acl-long.42.pdf
    description: LLM/NLP + computational social science + corpus annotation → adaptive policy communication → CAPC-CG (ACL 2026 Main, Oral).

