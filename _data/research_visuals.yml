    url: https://arxiv.org/pdf/2410.11906
    description: Interactive AI systems + behavioral experiments → privacy comprehension and human agency → Empowering Users in Digital Privacy Management through Interactive LLM-Based Agents (ICLR 2025).
  - id: p-stop
    key: stop
    short: When Language Models Stop Reading
    title: Language Models (Mostly) Know When to Stop Reading
    venue: NeurIPS 2025
    authors: Ruixi Xie · Jiacheng Wang · Petru Rosu · Chunyang Deng · Bolun Sun · Zining Lin · Bhuwan Dhingra
    url: https://openreview.net/pdf?id=naAUSeyoZ7
